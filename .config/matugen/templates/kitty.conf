# ============================================================
# Noctra OS - Kitty Matugen Color Template
# Processed by Matugen -> outputs to ~/.config/kitty/colors.conf
# ============================================================

# ── Base UI ──
background            {{colors.surface.default.hex}}
foreground            {{colors.on_surface.default.hex}}
selection_background  {{colors.surface_variant.default.hex}}
selection_foreground  {{colors.on_surface_variant.default.hex}}

# ── Cursor ──
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

# ── Tabs ──
active_tab_background   {{colors.primary.default.hex}}
active_tab_foreground   {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.surface_variant.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
tab_bar_background      {{colors.surface.default.hex}}

# ── The 16-Color ANSI Palette ──
# Black
color0  {{colors.surface.default.hex}}
color8  {{colors.surface_variant.default.hex}}

# Red
color1  {{colors.error.default.hex}}
color9  {{colors.error.default.hex}}

# Green
color2  {{colors.primary.default.hex}}
color10 {{colors.primary.default.hex}}

# Yellow
color3  {{colors.tertiary.default.hex}}
color11 {{colors.tertiary.default.hex}}

# Blue
color4  {{colors.primary_container.default.hex}}
color12 {{colors.primary_container.default.hex}}

# Magenta
color5  {{colors.secondary.default.hex}}
color13 {{colors.secondary.default.hex}}

# Cyan
color6  {{colors.secondary_container.default.hex}}
color14 {{colors.secondary_container.default.hex}}

# White
color7  {{colors.on_surface.default.hex}}
color15 {{colors.on_surface_variant.default.hex}}