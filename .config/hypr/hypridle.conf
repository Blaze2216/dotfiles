# ============================================================
# Noctra OS - Hypridle Configuration (Battery Optimized)
# ============================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple instances
    before_sleep_cmd = loginctl lock-session    # Lock before the system suspends
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn screen on after waking up
}

# 1. Dim the screen after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2. Lock the screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off the display after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend the laptop after 20 minutes to save battery
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
