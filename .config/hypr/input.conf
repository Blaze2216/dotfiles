# ┌─────────────────────────────────────────────────────────────┐
# │             Noctra OS - Input & Gestures                    │
# └─────────────────────────────────────────────────────────────┘

#############
### INPUT  ##
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.8
    }
}

##############################
###        GESTURES        ###
##############################

# The modern v0.50+ gesture syntax
gesture = 3, horizontal, workspace

# Fine-tuning the physics
gestures {
    # Distance in pixels you must move your fingers
    workspace_swipe_distance = 300 
    
    # Inverts the direction to match 'natural_scroll'
    workspace_swipe_invert = true  
    
    # You must swipe at least 30% of the screen width to commit
    workspace_swipe_cancel_ratio = 0.3 
    
    # Allows swiping past your last active workspace to create a new one
    workspace_swipe_create_new = true 
}