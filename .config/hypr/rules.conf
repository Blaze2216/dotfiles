##############################
###      LAYER RULES       ###
##############################
# Corrected matching logic for namespaces
layerrule = blur on, ignore_alpha 0.1, match:namespace rofi
layerrule = blur on, ignore_alpha 0.2, match:namespace waybar
layerrule = blur off, match:namespace swaync-control-center
layerrule = blur off, match:namespace swaync-notification-window

##############################
###      WINDOW RULES      ###
##############################
windowrule = suppress_event maximize, match:class .*

# Utilities
windowrule = float on, center on, size 620 440, match:class ^(pavucontrol|nm-connection-editor)$
windowrule = float on, center on, match:class ^(blueman-manager)$

# Dialogs
windowrule = float on, center on, match:title ^(Open File|Save File|Open Folder|File Chooser)$

# PiP
windowrule = float on, pin on, size 480 270, no_initial_focus on, match:title ^(Picture-in-Picture)$
windowrule = move (monitor_w-490) (monitor_h-280), match:title ^(Picture-in-Picture)$

# Fix XWayland Drags via block syntax
windowrule {
    name         = fix-xwayland-drags
    match:class  = ^$
    match:title  = ^$
    match:xwayland = true
    match:float  = true
    no_focus     = true
}

xwayland {
  force_zero_scaling = true
}

# Floating Wi-Fi Menu (nmtui)
windowrule = match:class ^(floating_nmtui)$, float 1, center 1, size 700 500, dim_around 1