# ┌─────────────────────────────────────────────────────────────┐
# │                 Noctra OS - Look & Feel                     │
# └─────────────────────────────────────────────────────────────┘

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1

    # Dynamically injects Matugen colors. Primary to Secondary gradient.
    col.active_border = $primary $secondary 45deg
    col.inactive_border = rgba(00000000)

    resize_on_border = true
    allow_tearing = false
    
    # Fixed to match your keybindings
    layout = dwindle 
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.90 # Slightly deeper contrast for inactive windows

    shadow {
        enabled = true
        range = 15
        render_power = 3
        # Uses the Matugen background color for the shadow to blend naturally
        color = rgba(00000099) 
        offset = 0 4
    }

    blur {
        enabled = true
        # Optimized APU Glassmorphism: 2 passes with size 8 looks better than 3 passes with size 6, and uses less GPU.
        size = 8
        passes = 2
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        new_optimizations = true
        ignore_opacity = true
        # Exclude the floating Waybar menus/tooltips from being heavily blurred
        popups = true
    }
}