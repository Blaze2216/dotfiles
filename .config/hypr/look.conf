#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in  = 4
    gaps_out = 8

    border_size = 1

    # Active border is a gradient; inactive is fully transparent (00 at the end)
    col.active_border   = rgba(c678ddff) rgba(e06c75ff) 45deg
    col.inactive_border = rgba(00000000)

    resize_on_border = true
    allow_tearing    = false
    layout           = master
}

decoration {
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 0.95

    # Refactored shadow block for low APU overhead
    shadow {
        enabled      = true
        range        = 4
        render_power = 1
        color        = rgba(00000088)
        offset       = 0 2
    }

    # Refactored blur block for performance (1 pass, small size)
    blur {
        enabled           = true
        size              = 6
        passes            = 3
        noise             = 0.01
        contrast          = 1.0
        brightness        = 1.0
        vibrancy          = 0.1
        new_optimizations = true
        ignore_opacity    = true
    }
}