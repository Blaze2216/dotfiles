# ============================================================
# Noctra OS - Hyprlock Matugen Template
# Processed by Matugen -> outputs to ~/.config/hypr/hyprlock.conf
# ============================================================

background {
    monitor =
    # Use the current desktop as the background and blur it heavily
    path = screenshot
    color = #151217
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    # Dynamic Matugen Colors
    outer_color = #dcb9f8
    inner_color = #151217
    font_color = #e8e0e8
    check_color = #f3b7bc
    fail_color = #ffb4ab
    
    fade_on_empty = false
    placeholder_text = <i><span foreground="##cdc4ce">Enter Password...</span></i>
    hide_input = false
    
    position = 0, -100
    halign = center
    valign = center
}

# Clock 
label {
    monitor =
    text = $TIME
    color = #dcb9f8
    font_size = 90
    font_family = JetBrainsMono Nerd Font Propo Bold
    position = 0, 100
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = Hi there, $USER
    color = #d1c1d9
    font_size = 22
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 0
    halign = center
    valign = center
}