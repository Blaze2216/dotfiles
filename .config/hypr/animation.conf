# ============================================================
# Noctra OS - Fluid Animations
# ============================================================

animations {
    enabled = yes

    # ── Custom Bezier Curves ──
    # Spring physics: Slight overshoot for a bouncy, premium feel
    bezier = spring, 0.13, 0.99, 0.29, 1.1
    # Smooth deceleration: Glides to a halt cleanly
    bezier = smooth, 0.25, 1, 0.5, 1
    # Sharp exit: Accelerates quickly to get out of your way
    bezier = sharp, 0.4, 0, 0.2, 1

    # ── Windows ──
    animation = windows,      1, 4, spring, popin 80%
    animation = windowsOut,   1, 3, sharp, popin 80%
    animation = windowsMove,  1, 4, spring

    # ── Fades & Borders ──
    animation = fade,         1, 2, sharp
    animation = border,       1, 5, smooth
    # If you ever use gradient borders, this makes them smoothly rotate
    animation = borderangle,  1, 30, smooth, loop 

    # ── Workspaces ──
    # Upgraded from 'slide' to 'slidefade' for a subtle depth effect
    animation = workspaces,   1, 4, smooth, slidefade 20%
}