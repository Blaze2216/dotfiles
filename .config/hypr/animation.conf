animations {
    enabled = yes

    # Snappy, instantaneous cubic-bezier
    bezier = snappy, 0.1, 0.9, 0.1, 1.05

    animation = windows,    1, 3, snappy, popin 80%
    animation = windowsOut, 1, 2, snappy, popin 80%
    animation = fade,       1, 2, snappy
    animation = workspaces, 1, 3, snappy, slide
    animation = border,     1, 2, snappy
}