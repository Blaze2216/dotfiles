# ============================================================
# Noctra OS - Kitty Terminal Config (Performance Optimized)
# ============================================================

# ── Dynamic Colors (Synced via Matugen) ──
include colors.conf

# ── Typography ──
# Unified with Waybar and Rofi (Strictly Monospaced)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures no

# ── Performance & Behavior ──
# VSync ENABLED: Matches your 60Hz display, saves battery
sync_to_monitor yes 

shell             zsh
# Re-enabled for advanced terminal features (click-to-copy, cwd tracking)
shell_integration enabled 

enable_audio_bell no
confirm_os_window_close 0

# ── Aesthetics & UI ──
cursor_shape block
cursor_blink_interval 0
url_style curly

# Layout
remember_window_size  no
window_padding_width  10

# Hardware-accelerated transparency
background_opacity 0.85

# Invisible scrollbars for minimalism
scrollbar_handle_opacity      0
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0