# ============================================================
#   hyprland.conf — clean, opinionated, wiki-verified
#   Philosophy: minimal chrome, maximum focus.
#   Tested against Hyprland v0.51+ / v0.53+ syntax.
# ============================================================

source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/monitors.conf


#################
### AUTOSTART  ###
#################

exec-once = waybar
exec-once = swaync
exec-once = awww-daemon
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swayosd-server

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 4
    gaps_out = 8

    border_size = 1

    # Rose-to-mauve gradient on active, near-invisible on inactive
    col.active_border   = rgba(e06c75ff) rgba(c678ddff) 45deg
    col.inactive_border = rgba(1e1e2eaa)

    resize_on_border = true
    allow_tearing    = false

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 0.90

    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(000000cc)
        # FIX: vec2 values are space-separated, not comma-separated
        offset       = 0 4
    }

    blur {
        enabled           = true
        size              = 6
        passes            = 2
        noise             = 0.02
        contrast          = 1.1
        brightness        = 0.9
        vibrancy          = 0.15
        new_optimizations = true
        ignore_opacity    = true
    }
}

animations {
    enabled = yes

    bezier = snap, 0.16, 1, 0.3, 1

    animation = windows,    1, 4, snap, popin 80%
    animation = windowsOut, 1, 3, snap, popin 90%
    animation = fade,       1, 2, snap
    animation = fadeOut,    1, 2, snap
    animation = workspaces, 1, 3, snap, slidefade 20%
    animation = border,     1, 8, default
    animation = layers,     1, 3, snap, fade
}


#############
### LAYOUT ##
#############

master {
    new_status           = slave
    new_on_top           = true
    mfact                = 0.55
    orientation          = left
}

dwindle {
    pseudotile     = true
    preserve_split = true
    smart_split    = true
}


###########
### MISC ##
###########

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    disable_autoreload      = false
    vfr                     = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
}


#############
### INPUT  ##
#############

input {
    kb_layout  = us
    kb_options = caps:escape

    follow_mouse  = 1
    sensitivity   = 0
    accel_profile = flat

    touchpad {
        natural_scroll       = true
        tap-to-click         = true
        drag_lock            = true
        disable_while_typing = true
    }
}

# FIX: gestures {} block with workspace_swipe_* was entirely removed in v0.51.
# The replacement is the `gesture` keyword. Only workspace_swipe_invert /
# workspace_swipe_distance survive inside the gestures {} block as of v0.51+.
gestures {
    workspace_swipe_invert   = false
    workspace_swipe_distance = 200
}

# 3-finger horizontal swipe to switch workspaces (new v0.51+ gesture syntax)
gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### LAYER RULES            ###
##############################

layerrule = blur on,          match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar

layerrule = blur on,          match:namespace rofi
layerrule = ignore_alpha 0.1, match:namespace rofi

layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center


##############################
### WINDOW RULES           ###
##############################

# FIX: suppress_event is the correct effect name (not suppress_event_maximize).
# The anonymous one-liner syntax: effect(s) then match, or match then effects.
windowrule = suppress_event maximize, match:class .*

# FIX: Static effects like float/center/pin require the `on` argument.
# FIX: Multiple effects for one match can be chained on a single line.
windowrule = float on, center on, size 600 400, match:class ^(pavucontrol|nm-connection-editor)$
windowrule = float on, center on, match:class ^(blueman-manager)$

# File/folder picker dialogs
windowrule = float on, center on, match:title ^(Open File|Save File|Open Folder|File Chooser)$

# Picture-in-picture — pinned bottom-right, always on top
# FIX: `noinitialfocus` → `no_initial_focus on` (correct effect name per wiki)
windowrule = float on, pin on, size 480 270, no_initial_focus on, match:title ^(Picture-in-Picture)$
windowrule = move (monitor_w-490) (monitor_h-280), match:title ^(Picture-in-Picture)$

# Steam sub-windows float; main Steam client stays tiled
windowrule = float on, center on, match:class ^(steam)$, match:title ^(?!Steam$).*

# Fix XWayland drag artefacts
windowrule {
    name             = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false
    no_focus         = true
}


##############################
### WORKSPACE RULES        ###
##############################

# FIX: `persistent:true` is not a valid workspace rule property.
# Use `default:true` to set the default workspace, or omit the flag entirely.
workspace = 2, default:true
workspace = 3, default:true


# ============================================================
# Fixes applied (wiki-verified):
#   1. shadow:offset   — vec2 is space-separated (was comma-separated)
#   2. gestures {}     — removed dead workspace_swipe_* options (gone v0.51)
#   3. float/center/pin/pin — added required `on` argument to static effects
#   4. noinitialfocus  — renamed to `no_initial_focus on` per current wiki
#   5. workspace persistent:true — replaced with `default:true` (valid property)
#   6. Window rules    — chained multiple effects on single match lines
# ============================================================
